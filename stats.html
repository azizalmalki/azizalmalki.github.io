<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>إحصائيات الموقع</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap">
<style>
body{margin:0;min-height:100svh;background:#1F1812;color:#FBF7F0;font-family:'IBM Plex Sans Arabic',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;box-sizing:border-box}
h1{margin:0 0 10px;font:700 26px 'Noto Naskh Arabic',serif;color:#C99A4B}
.card{width:100%;max-width:360px;padding:26px;border:1px solid rgba(201,184,164,.3);border-radius:14px;text-align:center}
.card b{display:block;font:700 56px 'Noto Naskh Arabic',serif;line-height:1.3}
.card span{color:#C9B8A4;font-size:15px}
a{color:#C9B8A4;font-size:14px}
</style>
</head>
<body>
<h1>إحصائيات موقعك</h1>
<div class="card"><b id="v">…</b><span>زيارة</span></div>
<div class="card"><b id="l">…</b><span>إعجاب</span></div>
<a href="./">رجوع للموقع</a>
<script>
const API='https://abacus.jasoncameron.dev/get/azizalmalki-site/';
['visits','likes'].forEach((k,i)=>fetch(API+k).then(r=>r.json()).then(d=>document.getElementById(i?'l':'v').textContent=Number(d.value||0).toLocaleString('ar')).catch(()=>document.getElementById(i?'l':'v').textContent='0'));
</script>
</body>
</html>
